name: Discovery Drift

on:
  schedule:
    # Weekly, Monday 06:17 UTC.
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Refetch discovery and regenerate on drift
        # Stdlib-only script: no dependency install needed. Exit 2 (stale
        # committed artifacts) fails the job; network absence is a clean skip.
        run: python codegen/check_drift.py --update
      - name: Open PR on drift
        uses: peter-evans/create-pull-request@v7
        with:
          branch: bot/discovery-drift
          title: 'codegen: discovery drift - regenerate docs_preview tools'
          commit-message: 'codegen: refresh discovery documents and regenerate docs_preview tools'
          body: |
            The weekly discovery-drift check found that regenerating the
            docs_preview tool surface from freshly fetched public discovery
            documents no longer matches the committed artifacts.

            This PR refreshes `codegen/discovery/*.json` and the generated
            modules under `gdocs_preview/generated/`. Review the generated
            diff (tool signatures/docstrings) before merging; the golden and
            behavioral tests in `tests/codegen/` and `tests/gdocs_preview/`
            must stay green.
          labels: codegen
          delete-branch: true
